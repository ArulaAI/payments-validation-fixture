# Configuration for Speed business-domain discovery on this repository.
# Run from the repository root: `speed discover domains` (full run) or
# `speed discover domains --facts-only` (extraction only; needs no model).
# A full run makes several large model requests, so the per-request timeout
# and the build output budget are raised above the defaults.

[agent]
support_model = "opus"
timeout = 2400

[business_domains]
max_build_output_tokens = 2048000
deadline_seconds = 10800

[plan]
# Keep the paymentslatest demo plan to at most 8 tasks.
max_tasks = 8

# speed ci: every check runs a real tool. See `speed ci --list`.
# speed eval runs one named test at a time with Node's runner; the test gate stays npm test.
[eval]
test_command = "node --test"

[security]
sast_cmd = "semgrep scan --config p/typescript --json --quiet --metrics=off ."
sca_cmd = "npm audit --json"
severity_threshold = "high"

[ci]
security_mode = "strict"

[ci.tools.trivy]
format = "trivy"

[ci.tools.gitleaks]
format = "gitleaks"

[ci.tools.codeql]
format = "sarif"
cmd = "sh ci/codeql.sh"

# SonarQube Community Build on the developer's machine (skipped in CI, which cannot reach it).
[ci.sonarqube]
host_url = "http://localhost:9000"
project_key = "payments-validation-fixture"
scanner_cmd = "$HOME/sonarqube-local/sonar-scanner-6.2.1.4610-macosx-aarch64/bin/sonar-scanner"
token_file = "~/sonarqube-local/speed-ci-token.txt"
