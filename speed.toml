# SPEED configuration for the Engineering 301 courses.

[agent]
support_model = "opus"
timeout = 2400

[plan]
# 301.1E Plan reads this cap. The lab guide tells learners it exists.
max_tasks = 8

# speed ci: every check runs a real tool. See `speed ci --list`.
# speed eval runs one named test at a time with Node's runner; the test gate stays npm test.
[eval]
test_command = "node --test"
# speed eval needs a machine-readable test report: node writes JUnit XML to the
# path eval passes in SPEED_EVAL_JUNIT_FILE. A zero exit with no report is not
# accepted as evidence.
test_file_patterns = ["test/*.test.ts"]

[security]
sast_cmd = "semgrep scan --config p/typescript --json --quiet --metrics=off ."
sca_cmd = "npm audit --json"
severity_threshold = "high"

[ci]
security_mode = "strict"

[ci.tools.trivy]
format = "trivy"

[ci.tools.gitleaks]
format = "gitleaks"

[ci.tools.codeql]
format = "sarif"
cmd = "sh ci/codeql.sh"

# SonarQube Community Build on the developer's machine (skipped in CI, which cannot reach it).
[ci.sonarqube]
host_url = "http://localhost:9000"
project_key = "payments-validation-fixture"
scanner_cmd = "$HOME/sonarqube-local/sonar-scanner-6.2.1.4610-macosx-aarch64/bin/sonar-scanner"
token_file = "~/sonarqube-local/speed-ci-token.txt"

[diagnose]
# F1 to F8 for speed diagnose, from SPEED tests/test_diagnose_round0_fixture.py with F4
# widened to step-up settlement. F8 compares new names with the F2.1 tech spec.
classes_file = ".speed/classes.yaml"
spec_file = "specs/tech/adaptive-auth/1-high-value-traveller.md"
