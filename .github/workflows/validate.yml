# CI. Plan 6.1, satisfying NFR-6.
#
# No install step, per NFR-9.
name: suite

on:
  push:
  pull_request:

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Suite
        run: node --test "test/**/*.test.ts"
