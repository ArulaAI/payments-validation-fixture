# Generated by `speed ci init`. Runs `speed ci` on every pull request and on
# every push to main. `speed ci` makes no model calls, so this workflow
# needs no model credentials and costs nothing beyond runner time.
# Rerun `speed ci init --force` after adding checks, tools or services to speed.toml.
name: SPEED CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: speed-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  speed-ci:
    name: speed-ci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the project
        uses: actions/checkout@v4
        with:
          # Keep tokens out of .git/config, where the project's own scripts could read them.
          persist-credentials: false
          # SonarQube needs the history to find new code and blame lines.
          fetch-depth: 0

      - name: Check out SPEED
        uses: actions/checkout@v4
        with:
          repository: "ArulaAI/workbench"
          ref: "feat/speed-ci"
          path: .speed-tool
          persist-credentials: false
          # A private SPEED repository needs a token that can read it.
          token: ${{ secrets.SPEED_REPO_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install SPEED
        run: |
          # Move SPEED out of the project so the project's own tools never see it.
          mv .speed-tool "$RUNNER_TEMP/speed"
          sudo apt-get update -qq && sudo apt-get install -y -qq jq
          python -m venv "$RUNNER_TEMP/speed/.venv"
          "$RUNNER_TEMP/speed/.venv/bin/pip" install -q -r "$RUNNER_TEMP/speed/requirements.txt"
          echo "SPEED_PYTHON=$RUNNER_TEMP/speed/.venv/bin/python3" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/speed" >> "$GITHUB_PATH"

      - name: Install trivy
        run: |
          cd "$RUNNER_TEMP"
          curl -sfLO https://github.com/aquasecurity/trivy/releases/download/v0.76.1/trivy_0.76.1_Linux-64bit.tar.gz
          curl -sfL https://github.com/aquasecurity/trivy/releases/download/v0.76.1/trivy_0.76.1_checksums.txt | grep ' trivy_0.76.1_Linux-64bit.tar.gz$' | sha256sum -c -
          sudo tar -xzf trivy_0.76.1_Linux-64bit.tar.gz -C /usr/local/bin trivy

      - name: Install gitleaks
        run: |
          curl -sfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks

      # Project setup: these steps were detected from the repository.
      # Review them and add anything else the project needs to build and test.
      - run: npm ci
      - name: Install Semgrep
        run: pip install -q semgrep==1.182.0
      - name: Put the runner's CodeQL on PATH
        run: |
          codeql_dir=$(ls -d /opt/hostedtoolcache/CodeQL/*/x64/codeql 2>/dev/null | sort -V | tail -1)
          if [ -z "$codeql_dir" ]; then
            curl -sfL https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.3/codeql-bundle-linux64.tar.gz \
              | tar -xz -C "$RUNNER_TEMP"
            codeql_dir="$RUNNER_TEMP/codeql"
          fi
          echo "$codeql_dir" >> "$GITHUB_PATH"

      - name: Run speed ci
        # The report goes outside the project so the checked tree stays clean.
        env:
          # Forks and Dependabot get no secrets; checks that need one are skipped there.
          SPEED_CI_SECRETS_UNAVAILABLE: "${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork || github.actor == 'dependabot[bot]') }}"
          SONAR_TOKEN: "${{ secrets.SONAR_TOKEN }}"
        run: speed --json ci > "$RUNNER_TEMP/speed-ci-report.json"

      - name: Upload findings to the Security tab
        if: always() && hashFiles('.speed/ci/speed-ci.sarif') != ''
        # Needs GitHub code scanning (public repositories, or Advanced Security on private ones).
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: .speed/ci/speed-ci.sarif
          category: speed-ci

      - name: Upload the CI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: speed-ci-report
          path: |
            ${{ runner.temp }}/speed-ci-report.json
            .speed/ci/
          include-hidden-files: true
          if-no-files-found: warn
