<svg xmlns="http://www.w3.org/2000/svg" width="960" height="658" viewBox="0 0 960 658" role="img" aria-label="How speed plan works"><title>How speed plan works</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA3AF"/></marker></defs><rect x="0.75" y="0.75" width="958.5" height="656.5" rx="16" fill="#FFFFFF" stroke="#E3E6EB" stroke-width="1.5"/><text x="32" y="40" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" font-weight="600" fill="#315F9E" text-anchor="start">$ speed plan --feature adaptive-auth</text><text x="32" y="67" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#27292D" text-anchor="start">Plan · three passes turn agreed specs into a task graph</text><text x="32" y="90" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5E646E" text-anchor="start">Gates decide whether to plan, the Architect drafts the plan, and checks change it afterwards.</text><rect x="836" y="24" width="92" height="26" rx="13" fill="#EAF0F8" stroke="#315F9E" stroke-width="1.2"/><text x="882" y="41.5" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#315F9E" text-anchor="middle">≈ 10 min</text><rect x="32" y="112" width="896" height="136" rx="14" fill="#F8F9FB" stroke="#E6E9EE" stroke-width="1.2" /><circle cx="62" cy="144" r="14" fill="#27292D"/><text x="62" y="149" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="84" y="149" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#27292D" text-anchor="start" letter-spacing="1.2">GATE</text><text x="50" y="180" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="650" fill="#27292D" text-anchor="start">Is this the right work?</text><text x="50" y="200" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">Either gate can stop</text><text x="50" y="215" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">the run</text><rect x="32" y="264" width="896" height="136" rx="14" fill="#F8F9FB" stroke="#E6E9EE" stroke-width="1.2" /><circle cx="62" cy="296" r="14" fill="#27292D"/><text x="62" y="301" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="84" y="301" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#27292D" text-anchor="start" letter-spacing="1.2">DRAFT</text><text x="50" y="332" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="650" fill="#27292D" text-anchor="start">Write the plan</text><text x="50" y="352" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">From an index, never</text><text x="50" y="367" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">the files</text><rect x="32" y="416" width="896" height="136" rx="14" fill="#F8F9FB" stroke="#E6E9EE" stroke-width="1.2" /><circle cx="62" cy="448" r="14" fill="#27292D"/><text x="62" y="453" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="84" y="453" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#27292D" text-anchor="start" letter-spacing="1.2">CHECK</text><text x="50" y="484" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="650" fill="#27292D" text-anchor="start">Fix what it missed</text><text x="50" y="504" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">The plan changes after</text><text x="50" y="519" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">it is written</text><rect x="214" y="128" width="180" height="104" rx="10" fill="#FFFFFF" stroke="#D9DCE1" stroke-width="1.5" /><text x="228" y="158" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#27292D" text-anchor="start">Feature documents</text><text x="228" y="178" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5E646E" text-anchor="start">Product, design,</text><text x="228" y="194" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5E646E" text-anchor="start">architecture and both</text><text x="228" y="210" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5E646E" text-anchor="start">RFCs</text><path d="M398,180.0 L437,180.0" fill="none" stroke="#9AA3AF" stroke-width="2" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="441" y="128" width="230" height="104" rx="10" fill="#315F9E" /><rect x="441" y="138" width="5" height="84" rx="2.5" fill="#D97706"/><rect x="455" y="139" width="36" height="17" rx="8.5" fill="#FEF3C7" fill-opacity="1"/><text x="473.2" y="151.2" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#92400E" text-anchor="middle" letter-spacing="0.6">GATE</text><rect x="497.4" y="139" width="43" height="17" rx="8.5" fill="#FFFFFF" fill-opacity="0.92"/><text x="518.9" y="151.2" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#315F9E" text-anchor="middle" letter-spacing="0.6">MODEL</text><g transform="translate(649,150)" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M0,-10 L8,-7 V0 C8,5 4,8.5 0,10.5 C-4,8.5 -8,5 -8,0 V-7 Z M-3.5,0 l2.5,2.5 l5,-5"/></g><text x="455" y="176" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">Guardian</text><text x="455" y="196" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#DCE6F4" text-anchor="start">Product vision and anti-goals:</text><text x="455" y="212" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#DCE6F4" text-anchor="start">approve, flag or reject</text><path d="M675,180.0 L694,180.0" fill="none" stroke="#9AA3AF" stroke-width="2" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="698" y="128" width="230" height="104" rx="10" fill="#315F9E" /><rect x="698" y="138" width="5" height="84" rx="2.5" fill="#D97706"/><rect x="712" y="139" width="36" height="17" rx="8.5" fill="#FEF3C7" fill-opacity="1"/><text x="730.2" y="151.2" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#92400E" text-anchor="middle" letter-spacing="0.6">GATE</text><rect x="754.4" y="139" width="43" height="17" rx="8.5" fill="#FFFFFF" fill-opacity="0.92"/><text x="775.9" y="151.2" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#315F9E" text-anchor="middle" letter-spacing="0.6">MODEL</text><g transform="translate(906,150)" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M-2,-2 m-6,0 a6,6 0 1,0 12,0 a6,6 0 1,0 -12,0 M2.5,2.5 L8,8"/></g><text x="712" y="176" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">Audit gate</text><text x="712" y="196" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#DCE6F4" text-anchor="start">Re-audits every spec it will</text><text x="712" y="212" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#DCE6F4" text-anchor="start">plan from</text><path d="M813,235 L813,257 L304,257 L304,276" fill="none" stroke="#9AA3AF" stroke-width="2" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="214" y="280" width="180" height="104" rx="10" fill="#FFFFFF" stroke="#27292D" stroke-width="1.5" /><rect x="228" y="291" width="36" height="17" rx="8.5" fill="#EEF0F3" fill-opacity="1"/><text x="246.2" y="303.2" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#27292D" text-anchor="middle" letter-spacing="0.6">CODE</text><g transform="translate(372,302)" fill="none" stroke="#27292D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M-7,6 L0,-6 L7,6 Z"/><circle cx="-7" cy="6" r="2.6" fill="#27292D"/><circle cx="0" cy="-6" r="2.6" fill="#27292D"/><circle cx="7" cy="6" r="2.6" fill="#27292D"/></g><text x="228" y="328" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#27292D" text-anchor="start">Code index</text><text x="228" y="348" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5E646E" text-anchor="start">Files, symbols, who</text><text x="228" y="364" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5E646E" text-anchor="start">calls whom</text><path d="M398,332.0 L437,332.0" stroke="#9AA3AF" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#ah)"/><rect x="441" y="280" width="290" height="104" rx="10" fill="#315F9E" /><rect x="455" y="291" width="43" height="17" rx="8.5" fill="#FFFFFF" fill-opacity="0.92"/><text x="476.5" y="303.2" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#315F9E" text-anchor="middle" letter-spacing="0.6">MODEL</text><rect x="504.0" y="291" width="102" height="17" rx="8.5" fill="#27292D"/><text x="554.8" y="303.2" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.6">NO FILE ACCESS</text><g transform="translate(709,302)" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M-8,8 L-6,2 L4,-8 L8,-4 L-2,6 Z M-6,2 L-2,6"/></g><text x="455" y="328" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">Architect</text><text x="455" y="348" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#DCE6F4" text-anchor="start">Drafts a skeleton, then fills it in.</text><text x="455" y="364" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#DCE6F4" text-anchor="start">Sees only the index and the specs</text><path d="M770,332.0 L735,332.0" fill="none" stroke="#9AA3AF" stroke-width="2" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="774" y="288" width="154" height="88" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4" /><text x="788" y="314" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13.5" font-weight="700" fill="#92400E" text-anchor="start">max_tasks</text><text x="788" y="333" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">speed.toml caps</text><text x="788" y="348" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">the task count</text><path d="M586,387 L586,409 L304,409 L304,428" fill="none" stroke="#9AA3AF" stroke-width="2" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="214" y="432" width="220" height="104" rx="10" fill="#315F9E" /><rect x="228" y="443" width="43" height="17" rx="8.5" fill="#FFFFFF" fill-opacity="0.92"/><text x="249.5" y="455.2" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#315F9E" text-anchor="middle" letter-spacing="0.6">MODEL</text><g transform="translate(412,454)" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M-8,-6 h4 M-8,1 h4 M-8,8 h4 M0,-6 h8 M0,1 h8 M0,8 h8"/></g><text x="228" y="480" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">Coverage check</text><text x="228" y="500" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#DCE6F4" text-anchor="start">Finds requirements no task</text><text x="228" y="516" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#DCE6F4" text-anchor="start">covers, then adds tasks</text><path d="M438,484.0 L473,484.0" fill="none" stroke="#9AA3AF" stroke-width="2" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="477" y="432" width="220" height="104" rx="10" fill="#FFFFFF" stroke="#27292D" stroke-width="1.5" /><rect x="477" y="442" width="5" height="84" rx="2.5" fill="#D97706"/><rect x="491" y="443" width="36" height="17" rx="8.5" fill="#FEF3C7" fill-opacity="1"/><text x="509.2" y="455.2" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#92400E" text-anchor="middle" letter-spacing="0.6">GATE</text><rect x="533.4" y="443" width="36" height="17" rx="8.5" fill="#EEF0F3" fill-opacity="1"/><text x="551.6" y="455.2" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#27292D" text-anchor="middle" letter-spacing="0.6">CODE</text><g transform="translate(675,454)" fill="none" stroke="#27292D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M-8,-8 h7 v7 h-7 z M1,-8 h7 v7 h-7 z M-8,1 h7 v7 h-7 z M1,1 h7 v7 h-7 z"/></g><text x="491" y="480" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#27292D" text-anchor="start">Decomposition gate</text><text x="491" y="500" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5E646E" text-anchor="start">Task size, and two tasks</text><text x="491" y="516" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5E646E" text-anchor="start">changing one file</text><path d="M701,484.0 L720,484.0" fill="none" stroke="#9AA3AF" stroke-width="2" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="724" y="432" width="204" height="104" rx="10" fill="#EAF0F8" stroke="#315F9E" stroke-width="1.5" /><rect x="738" y="443" width="50" height="17" rx="8.5" fill="#FFFFFF" fill-opacity="1"/><text x="762.8" y="455.2" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#315F9E" text-anchor="middle" letter-spacing="0.6">OUTPUT</text><text x="738" y="478" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#315F9E" text-anchor="start">Task plan</text><text x="738" y="496" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" font-weight="500" fill="#27292D" text-anchor="start">tasks/*.json · contract.json</text><text x="738" y="510" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" font-weight="500" fill="#27292D" text-anchor="start">cross_cutting_concerns.json</text><rect x="32" y="568" width="896" height="52" rx="10" fill="#27292D" /><rect x="48" y="585.0" width="58" height="18" rx="9" fill="#FEF3C7"/><text x="77" y="598.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#92400E" text-anchor="middle" letter-spacing="0.8">LIMIT</text><text x="120" y="590.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#FFFFFF" text-anchor="start">A plan has several authors: gates, the Architect, then checks that change it. Read the task graph back to the</text><text x="120" y="607.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#FFFFFF" text-anchor="start">specs, not just the exit code.</text><rect x="32" y="632" width="14" height="14" rx="3" fill="#315F9E" /><text x="53" y="643.5" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">Model judgment</text><rect x="154.39999999999998" y="632" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#27292D" stroke-width="1.3" /><text x="175.39999999999998" y="643.5" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">Deterministic code</text><rect x="303.2" y="632" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#D9DCE1" stroke-width="1" /><rect x="303.2" y="632" width="4" height="14" rx="2" fill="#D97706"/><text x="324.2" y="643.5" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">Gate: can stop the run</text><rect x="478.4" y="632" width="14" height="14" rx="3" fill="#F6F6F7" stroke="#D9DCE1" stroke-width="1.3" /><text x="499.4" y="643.5" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">Input</text><rect x="541.4" y="632" width="14" height="14" rx="3" fill="#EAF0F8" stroke="#315F9E" stroke-width="1.3" /><text x="562.4" y="643.5" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">Output</text></svg>