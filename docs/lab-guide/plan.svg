<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="How speed plan works"><title>How speed plan works</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA3AF"/></marker></defs><rect x="0.75" y="0.75" width="958.5" height="558.5" rx="16" fill="#FFFFFF" stroke="#E3E6EB" stroke-width="1.5"/><text x="32" y="40" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" font-weight="600" fill="#315F9E" text-anchor="start">$ speed plan --feature adaptive-auth</text><text x="32" y="67" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#27292D" text-anchor="start">Plan · from agreed specs to an ordered task graph</text><text x="32" y="90" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5E646E" text-anchor="start">About 10 minutes. Gates can stop the run; the Architect writes the plan; checks then change it.</text><rect x="32" y="118" width="197" height="128" rx="10" fill="#F6F6F7" stroke="#D9DCE1" stroke-width="1.5" /><rect x="46" y="130" width="43" height="17" rx="8.5" fill="#E4E7EC" fill-opacity="1"/><text x="67.5" y="142.2" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#5E646E" text-anchor="middle" letter-spacing="0.6">INPUT</text><text x="46" y="166" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="650" fill="#27292D" text-anchor="start">Feature documents</text><text x="46" y="188" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">Product, design,</text><text x="46" y="204" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">architecture and both</text><text x="46" y="220" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">RFCs, plus shared platform</text><text x="46" y="236" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">architecture</text><path d="M233,182.0 L261,182.0" fill="none" stroke="#9AA3AF" stroke-width="2" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="265" y="118" width="197" height="128" rx="10" fill="#315F9E" /><rect x="265" y="128" width="5" height="108" rx="2.5" fill="#D97706"/><rect x="279" y="130" width="36" height="17" rx="8.5" fill="#FEF3C7" fill-opacity="1"/><text x="297.2" y="142.2" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#92400E" text-anchor="middle" letter-spacing="0.6">GATE</text><rect x="321.4" y="130" width="43" height="17" rx="8.5" fill="#FFFFFF" fill-opacity="0.92"/><text x="342.9" y="142.2" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#315F9E" text-anchor="middle" letter-spacing="0.6">MODEL</text><text x="279" y="166" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="650" fill="#FFFFFF" text-anchor="start">Guardian</text><text x="279" y="188" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#DCE6F4" text-anchor="start">Checks scope against the</text><text x="279" y="204" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#DCE6F4" text-anchor="start">product vision and</text><text x="279" y="220" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#DCE6F4" text-anchor="start">anti-goals. Approve, flag,</text><text x="279" y="236" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#DCE6F4" text-anchor="start">or reject (stops the run)</text><path d="M466,182.0 L494,182.0" fill="none" stroke="#9AA3AF" stroke-width="2" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="498" y="118" width="197" height="128" rx="10" fill="#315F9E" /><rect x="498" y="128" width="5" height="108" rx="2.5" fill="#D97706"/><rect x="512" y="130" width="36" height="17" rx="8.5" fill="#FEF3C7" fill-opacity="1"/><text x="530.2" y="142.2" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#92400E" text-anchor="middle" letter-spacing="0.6">GATE</text><rect x="554.4" y="130" width="43" height="17" rx="8.5" fill="#FFFFFF" fill-opacity="0.92"/><text x="575.9" y="142.2" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#315F9E" text-anchor="middle" letter-spacing="0.6">MODEL</text><text x="512" y="166" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="650" fill="#FFFFFF" text-anchor="start">Audit gate</text><text x="512" y="188" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#DCE6F4" text-anchor="start">Re-audits every planning</text><text x="512" y="204" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#DCE6F4" text-anchor="start">spec, even if you ran</text><text x="512" y="220" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#DCE6F4" text-anchor="start">Audit already</text><path d="M699,182.0 L727,182.0" fill="none" stroke="#9AA3AF" stroke-width="2" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="731" y="118" width="197" height="128" rx="10" fill="#FFFFFF" stroke="#27292D" stroke-width="1.5" /><rect x="745" y="130" width="36" height="17" rx="8.5" fill="#EEF0F3" fill-opacity="1"/><text x="763.2" y="142.2" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#27292D" text-anchor="middle" letter-spacing="0.6">CODE</text><text x="745" y="166" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="650" fill="#27292D" text-anchor="start">Code index</text><text x="745" y="188" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">Layer 1: files, symbols,</text><text x="745" y="204" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">who calls whom. Reads the</text><text x="745" y="220" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">task budget (max_tasks)</text><rect x="32" y="290" width="197" height="128" rx="10" fill="#315F9E" /><rect x="46" y="302" width="43" height="17" rx="8.5" fill="#FFFFFF" fill-opacity="0.92"/><text x="67.5" y="314.2" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#315F9E" text-anchor="middle" letter-spacing="0.6">MODEL</text><text x="46" y="338" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="650" fill="#FFFFFF" text-anchor="start">Architect</text><text x="46" y="360" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#DCE6F4" text-anchor="start">Drafts a skeleton, then</text><text x="46" y="376" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#DCE6F4" text-anchor="start">enriches it. No tools: it</text><text x="46" y="392" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#DCE6F4" text-anchor="start">sees only the index and</text><text x="46" y="408" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#DCE6F4" text-anchor="start">the specs</text><path d="M233,354.0 L261,354.0" fill="none" stroke="#9AA3AF" stroke-width="2" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="265" y="290" width="197" height="128" rx="10" fill="#315F9E" /><rect x="279" y="302" width="43" height="17" rx="8.5" fill="#FFFFFF" fill-opacity="0.92"/><text x="300.5" y="314.2" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#315F9E" text-anchor="middle" letter-spacing="0.6">MODEL</text><text x="279" y="338" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="650" fill="#FFFFFF" text-anchor="start">Coverage check</text><text x="279" y="360" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#DCE6F4" text-anchor="start">Finds requirements no task</text><text x="279" y="376" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#DCE6F4" text-anchor="start">covers, and repairs by</text><text x="279" y="392" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#DCE6F4" text-anchor="start">adding tasks</text><path d="M466,354.0 L494,354.0" fill="none" stroke="#9AA3AF" stroke-width="2" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="498" y="290" width="197" height="128" rx="10" fill="#FFFFFF" stroke="#27292D" stroke-width="1.5" /><rect x="498" y="300" width="5" height="108" rx="2.5" fill="#D97706"/><rect x="512" y="302" width="36" height="17" rx="8.5" fill="#FEF3C7" fill-opacity="1"/><text x="530.2" y="314.2" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#92400E" text-anchor="middle" letter-spacing="0.6">GATE</text><rect x="554.4" y="302" width="36" height="17" rx="8.5" fill="#EEF0F3" fill-opacity="1"/><text x="572.6" y="314.2" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#27292D" text-anchor="middle" letter-spacing="0.6">CODE</text><text x="512" y="338" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="650" fill="#27292D" text-anchor="start">Decomposition gate</text><text x="512" y="360" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">Task size and tasks that</text><text x="512" y="376" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">change the same files</text><path d="M699,354.0 L727,354.0" fill="none" stroke="#9AA3AF" stroke-width="2" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="731" y="290" width="197" height="128" rx="10" fill="#EAF0F8" stroke="#315F9E" stroke-width="1.5" /><rect x="745" y="302" width="50" height="17" rx="8.5" fill="#FFFFFF" fill-opacity="1"/><text x="769.8" y="314.2" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#315F9E" text-anchor="middle" letter-spacing="0.6">OUTPUT</text><text x="745" y="338" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" font-weight="650" fill="#315F9E" text-anchor="start">.speed/features/</text><text x="745" y="356" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" font-weight="650" fill="#315F9E" text-anchor="start">adaptive-auth/</text><text x="745" y="378" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#27292D" text-anchor="start">tasks/*.json,</text><text x="745" y="394" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#27292D" text-anchor="start">contract.json,</text><text x="745" y="410" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#27292D" text-anchor="start">cross_cutting_concerns.json</text><path d="M829.5,250 L829.5,268 L130.5,268 L130.5,286" fill="none" stroke="#9AA3AF" stroke-width="2" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="32" y="462" width="896" height="56" rx="10" fill="#27292D" /><rect x="48" y="481.0" width="58" height="18" rx="9" fill="#FEF3C7"/><text x="77" y="494.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#92400E" text-anchor="middle" letter-spacing="0.8">LIMIT</text><text x="120" y="486.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#FFFFFF" text-anchor="start">The Architect never opens a file: a thin index means a thin plan, with no warning. A setting, max_tasks, caps</text><text x="120" y="503.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#FFFFFF" text-anchor="start">how many tasks you get.</text><rect x="32" y="532" width="14" height="14" rx="3" fill="#315F9E" /><text x="53" y="543.5" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">Model judgment</text><rect x="154.39999999999998" y="532" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#27292D" stroke-width="1.3" /><text x="175.39999999999998" y="543.5" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">Deterministic code</text><rect x="303.2" y="532" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#D9DCE1" stroke-width="1" /><rect x="303.2" y="532" width="4" height="14" rx="2" fill="#D97706"/><text x="324.2" y="543.5" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">Gate: can stop the run</text><rect x="478.4" y="532" width="14" height="14" rx="3" fill="#F6F6F7" stroke="#D9DCE1" stroke-width="1.3" /><text x="499.4" y="543.5" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">Input</text><rect x="541.4" y="532" width="14" height="14" rx="3" fill="#EAF0F8" stroke="#315F9E" stroke-width="1.3" /><text x="562.4" y="543.5" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">Output</text></svg>