<svg xmlns="http://www.w3.org/2000/svg" width="960" height="424" viewBox="0 0 960 424" role="img" aria-label="How speed audit works"><title>How speed audit works</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA3AF"/></marker></defs><rect x="0.75" y="0.75" width="958.5" height="422.5" rx="16" fill="#FFFFFF" stroke="#E3E6EB" stroke-width="1.5"/><text x="32" y="40" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" font-weight="600" fill="#315F9E" text-anchor="start">$ speed audit specs/tech/adaptive-auth/&lt;spec&gt;.md</text><text x="32" y="67" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#27292D" text-anchor="start">Audit · a second reader for one spec</text><text x="32" y="90" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5E646E" text-anchor="start">Run once per spec. A model checks it against its template and the documents it links to.</text><rect x="32" y="118" width="236" height="42" rx="8" fill="#F6F6F7" stroke="#D9DCE1" stroke-width="1.2" /><path d="M45,129 h11 l5,5 v15 h-16 z" fill="#FFFFFF" stroke="#5E646E" stroke-width="1.2"/><text x="70" y="136" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="650" fill="#27292D" text-anchor="start">Your spec</text><text x="70" y="151" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5E646E" text-anchor="start">one RFC per run</text><path d="M272,139 C300,139 296,190 318,190" fill="none" stroke="#9AA3AF" stroke-width="2" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="32" y="168" width="236" height="42" rx="8" fill="#F6F6F7" stroke="#D9DCE1" stroke-width="1.2" /><path d="M45,179 h11 l5,5 v15 h-16 z" fill="#FFFFFF" stroke="#5E646E" stroke-width="1.2"/><text x="70" y="186" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="650" fill="#27292D" text-anchor="start">RFC template</text><text x="70" y="201" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5E646E" text-anchor="start">the structural contract</text><path d="M272,189 C300,189 296,190 318,190" fill="none" stroke="#9AA3AF" stroke-width="2" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="32" y="218" width="236" height="42" rx="8" fill="#F6F6F7" stroke="#D9DCE1" stroke-width="1.2" /><path d="M45,229 h11 l5,5 v15 h-16 z" fill="#FFFFFF" stroke="#5E646E" stroke-width="1.2"/><text x="70" y="236" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="650" fill="#27292D" text-anchor="start">Linked PRD and related feature</text><text x="70" y="251" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5E646E" text-anchor="start">found from the spec's own links</text><path d="M272,239 C300,239 296,190 318,190" fill="none" stroke="#9AA3AF" stroke-width="2" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="32" y="268" width="236" height="42" rx="8" fill="#F6F6F7" stroke="#D9DCE1" stroke-width="1.2" /><path d="M45,279 h11 l5,5 v15 h-16 z" fill="#FFFFFF" stroke="#5E646E" stroke-width="1.2"/><text x="70" y="286" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="650" fill="#27292D" text-anchor="start">Product vision</text><text x="70" y="301" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="400" fill="#5E646E" text-anchor="start">specs/product/overview.md</text><path d="M272,289 C300,289 296,190 318,190" fill="none" stroke="#9AA3AF" stroke-width="2" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="322" y="118" width="360" height="192" rx="10" fill="#315F9E" /><rect x="336" y="130" width="43" height="17" rx="8.5" fill="#FFFFFF" fill-opacity="0.92"/><text x="357.5" y="142.2" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#315F9E" text-anchor="middle" letter-spacing="0.6">MODEL</text><text x="336" y="166" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="650" fill="#FFFFFF" text-anchor="start">Audit agent</text><rect x="336" y="178" width="332" height="25" rx="6" fill="#FFFFFF" fill-opacity="0.12"/><text x="347" y="195" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="start">L1</text><text x="372" y="195" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="650" fill="#FFFFFF" text-anchor="start">Structure</text><text x="474" y="195" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#DCE6F4" text-anchor="start">missing sections, broken links → FAIL</text><rect x="336" y="209" width="332" height="25" rx="6" fill="#FFFFFF" fill-opacity="0.12"/><text x="347" y="226" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="start">L2</text><text x="372" y="226" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="650" fill="#FFFFFF" text-anchor="start">Completeness</text><text x="474" y="226" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#DCE6F4" text-anchor="start">thin or vague sections</text><rect x="336" y="240" width="332" height="25" rx="6" fill="#FFFFFF" fill-opacity="0.12"/><text x="347" y="257" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="start">L3</text><text x="372" y="257" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="650" fill="#FFFFFF" text-anchor="start">Consistency</text><text x="474" y="257" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#DCE6F4" text-anchor="start">agrees with PRD, design, other RFCs</text><rect x="336" y="271" width="332" height="25" rx="6" fill="#FFFFFF" fill-opacity="0.12"/><text x="347" y="288" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="start">L4</text><text x="372" y="288" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="650" fill="#FFFFFF" text-anchor="start">Sizing</text><text x="474" y="288" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#DCE6F4" text-anchor="start">split advice, always a warning</text><path d="M686,214 L716,214" fill="none" stroke="#9AA3AF" stroke-width="2" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="720" y="118" width="208" height="192" rx="10" fill="#EAF0F8" stroke="#315F9E" stroke-width="1.5" /><rect x="734" y="130" width="50" height="17" rx="8.5" fill="#FFFFFF" fill-opacity="1"/><text x="758.8" y="142.2" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#315F9E" text-anchor="middle" letter-spacing="0.6">OUTPUT</text><text x="734" y="166" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" font-weight="650" fill="#315F9E" text-anchor="start">.speed/logs/</text><text x="734" y="184" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" font-weight="650" fill="#315F9E" text-anchor="start">audit-&lt;timestamp&gt;.json</text><rect x="734" y="202" width="54" height="24" rx="12" fill="#FFFFFF" stroke="#D9DCE1" stroke-width="1"/><text x="761" y="218.5" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#27292D" text-anchor="middle" letter-spacing="0.6">PASS</text><text x="798" y="218.5" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#27292D" text-anchor="start">no issues found</text><rect x="734" y="236" width="54" height="24" rx="12" fill="#FEF3C7" stroke="#D9DCE1" stroke-width="1"/><text x="761" y="252.5" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#92400E" text-anchor="middle" letter-spacing="0.6">WARN</text><text x="798" y="252.5" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#27292D" text-anchor="start">exit 0, gaps remain</text><rect x="734" y="270" width="54" height="24" rx="12" fill="#27292D" stroke="#D9DCE1" stroke-width="1"/><text x="761" y="286.5" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.6">FAIL</text><text x="798" y="286.5" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#27292D" text-anchor="start">Level 1 errors</text><rect x="32" y="334" width="896" height="50" rx="10" fill="#27292D" /><rect x="48" y="350.0" width="58" height="18" rx="9" fill="#FEF3C7"/><text x="77" y="363.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#92400E" text-anchor="middle" letter-spacing="0.8">LIMIT</text><text x="120" y="355.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#FFFFFF" text-anchor="start">Reads specs, never the code, so a clean audit is not a correct spec. Give each finding a disposition: a</text><text x="120" y="372.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#FFFFFF" text-anchor="start">correction, an owner, or no action.</text><rect x="32" y="396" width="14" height="14" rx="3" fill="#315F9E" /><text x="53" y="407.5" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">Model judgment</text><rect x="154.39999999999998" y="396" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#27292D" stroke-width="1.3" /><text x="175.39999999999998" y="407.5" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">Deterministic code</text><rect x="303.2" y="396" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#D9DCE1" stroke-width="1" /><rect x="303.2" y="396" width="4" height="14" rx="2" fill="#D97706"/><text x="324.2" y="407.5" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">Gate: can stop the run</text><rect x="478.4" y="396" width="14" height="14" rx="3" fill="#F6F6F7" stroke="#D9DCE1" stroke-width="1.3" /><text x="499.4" y="407.5" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">Input</text><rect x="541.4" y="396" width="14" height="14" rx="3" fill="#EAF0F8" stroke="#315F9E" stroke-width="1.3" /><text x="562.4" y="407.5" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">Output</text></svg>