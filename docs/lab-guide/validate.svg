<svg xmlns="http://www.w3.org/2000/svg" width="960" height="392" viewBox="0 0 960 392" role="img" aria-label="How speed validate works"><title>How speed validate works</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA3AF"/></marker></defs><rect x="0.75" y="0.75" width="958.5" height="390.5" rx="16" fill="#FFFFFF" stroke="#E3E6EB" stroke-width="1.5"/><text x="32" y="40" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" font-weight="600" fill="#315F9E" text-anchor="start">$ speed validate specs/</text><text x="32" y="67" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#27292D" text-anchor="start">Validate · do the documents agree?</text><text x="32" y="90" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5E646E" text-anchor="start">One model reads every document at once and reports where they disagree.</text><rect x="32" y="118" width="152" height="158" rx="10" fill="#F6F6F7" stroke="#D9DCE1" stroke-width="1.5" /><rect x="46" y="130" width="43" height="17" rx="8.5" fill="#E4E7EC" fill-opacity="1"/><text x="67.5" y="142.2" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#5E646E" text-anchor="middle" letter-spacing="0.6">INPUT</text><text x="46" y="166" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" font-weight="650" fill="#27292D" text-anchor="start">specs/</text><text x="46" y="188" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">Every .md file:</text><text x="46" y="204" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">product, design,</text><text x="46" y="220" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">architecture, tech,</text><text x="46" y="236" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">plus READMEs and</text><text x="46" y="252" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">older specs</text><path d="M188,197.0 L214,197.0" fill="none" stroke="#9AA3AF" stroke-width="2" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="218" y="118" width="152" height="158" rx="10" fill="#FFFFFF" stroke="#27292D" stroke-width="1.5" /><rect x="232" y="130" width="36" height="17" rx="8.5" fill="#EEF0F3" fill-opacity="1"/><text x="250.2" y="142.2" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#27292D" text-anchor="middle" letter-spacing="0.6">CODE</text><text x="232" y="166" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="650" fill="#27292D" text-anchor="start">Collect</text><text x="232" y="188" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">Joins every file</text><text x="232" y="204" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">into one message,</text><text x="232" y="220" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">each with its path</text><path d="M374,197.0 L400,197.0" fill="none" stroke="#9AA3AF" stroke-width="2" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="404" y="118" width="152" height="158" rx="10" fill="#315F9E" /><rect x="418" y="130" width="43" height="17" rx="8.5" fill="#FFFFFF" fill-opacity="0.92"/><text x="439.5" y="142.2" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#315F9E" text-anchor="middle" letter-spacing="0.6">MODEL</text><text x="418" y="166" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="650" fill="#FFFFFF" text-anchor="start">Validator</text><text x="418" y="188" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#DCE6F4" text-anchor="start">Reads them</text><text x="418" y="204" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#DCE6F4" text-anchor="start">together. Flags</text><text x="418" y="220" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#DCE6F4" text-anchor="start">contradictions,</text><text x="418" y="236" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#DCE6F4" text-anchor="start">missing links and</text><text x="418" y="252" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#DCE6F4" text-anchor="start">orphan requirements</text><path d="M560,197.0 L586,197.0" fill="none" stroke="#9AA3AF" stroke-width="2" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="590" y="118" width="152" height="158" rx="10" fill="#FFFFFF" stroke="#27292D" stroke-width="1.5" /><rect x="604" y="130" width="36" height="17" rx="8.5" fill="#EEF0F3" fill-opacity="1"/><text x="622.2" y="142.2" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#27292D" text-anchor="middle" letter-spacing="0.6">CODE</text><text x="604" y="166" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="650" fill="#27292D" text-anchor="start">Verdict</text><text x="604" y="188" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">Needs valid JSON. A</text><text x="604" y="204" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">pass that lists</text><text x="604" y="220" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">critical gaps</text><text x="604" y="236" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">counts as a fail</text><path d="M746,197.0 L772,197.0" fill="none" stroke="#9AA3AF" stroke-width="2" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="776" y="118" width="152" height="158" rx="10" fill="#EAF0F8" stroke="#315F9E" stroke-width="1.5" /><rect x="790" y="130" width="50" height="17" rx="8.5" fill="#FFFFFF" fill-opacity="1"/><text x="814.8" y="142.2" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#315F9E" text-anchor="middle" letter-spacing="0.6">OUTPUT</text><text x="790" y="166" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" font-weight="650" fill="#315F9E" text-anchor="start">.speed/logs/</text><text x="790" y="184" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" font-weight="650" fill="#315F9E" text-anchor="start">validation.log</text><text x="790" y="206" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#27292D" text-anchor="start">Critical gaps and</text><text x="790" y="222" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#27292D" text-anchor="start">warnings. Exit 1</text><text x="790" y="238" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#27292D" text-anchor="start">when gaps exist</text><rect x="32" y="300" width="896" height="50" rx="10" fill="#27292D" /><rect x="48" y="316.0" width="58" height="18" rx="9" fill="#FEF3C7"/><text x="77" y="329.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#92400E" text-anchor="middle" letter-spacing="0.8">LIMIT</text><text x="120" y="329.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#FFFFFF" text-anchor="start">Reads documents only, never the code. Every finding is a claim: open its citation before you act on it.</text><rect x="32" y="364" width="14" height="14" rx="3" fill="#315F9E" /><text x="53" y="375.5" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">Model judgment</text><rect x="154.39999999999998" y="364" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#27292D" stroke-width="1.3" /><text x="175.39999999999998" y="375.5" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">Deterministic code</text><rect x="303.2" y="364" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#D9DCE1" stroke-width="1" /><rect x="303.2" y="364" width="4" height="14" rx="2" fill="#D97706"/><text x="324.2" y="375.5" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">Gate: can stop the run</text><rect x="478.4" y="364" width="14" height="14" rx="3" fill="#F6F6F7" stroke="#D9DCE1" stroke-width="1.3" /><text x="499.4" y="375.5" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">Input</text><rect x="541.4" y="364" width="14" height="14" rx="3" fill="#EAF0F8" stroke="#315F9E" stroke-width="1.3" /><text x="562.4" y="375.5" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">Output</text></svg>