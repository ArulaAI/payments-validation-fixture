<svg xmlns="http://www.w3.org/2000/svg" width="960" height="558" viewBox="0 0 960 558" role="img" aria-label="How speed verify works"><title>How speed verify works</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA3AF"/></marker></defs><rect x="0.75" y="0.75" width="958.5" height="556.5" rx="16" fill="#FFFFFF" stroke="#E3E6EB" stroke-width="1.5"/><text x="32" y="40" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" font-weight="600" fill="#315F9E" text-anchor="start">$ speed verify --feature adaptive-auth</text><text x="32" y="67" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#27292D" text-anchor="start">Verify · does the plan still say what the specs meant?</text><text x="32" y="90" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5E646E" text-anchor="start">A reader that never saw the Architect's reasoning checks the plan. A separate agent may repair it.</text><rect x="32" y="124" width="176" height="54" rx="8" fill="#F6F6F7" stroke="#D9DCE1" stroke-width="1.2" /><path d="M45,138 h11 l5,5 v15 h-16 z" fill="#FFFFFF" stroke="#5E646E" stroke-width="1.2"/><text x="70" y="147" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="650" fill="#27292D" text-anchor="start">Feature specs</text><text x="70" y="164" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5E646E" text-anchor="start">all the feature's documents</text><path d="M212,151 C232,151 228,184.0 246,184.0" fill="none" stroke="#9AA3AF" stroke-width="2" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="32" y="190" width="176" height="54" rx="8" fill="#F6F6F7" stroke="#D9DCE1" stroke-width="1.2" /><path d="M45,204 h11 l5,5 v15 h-16 z" fill="#FFFFFF" stroke="#5E646E" stroke-width="1.2"/><text x="70" y="213" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="650" fill="#27292D" text-anchor="start">Task plan</text><text x="70" y="230" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5E646E" text-anchor="start">task records and contract</text><path d="M212,217 C232,217 228,184.0 246,184.0" fill="none" stroke="#9AA3AF" stroke-width="2" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="250" y="118" width="160" height="132" rx="10" fill="#FFFFFF" stroke="#27292D" stroke-width="1.5" /><rect x="264" y="130" width="36" height="17" rx="8.5" fill="#EEF0F3" fill-opacity="1"/><text x="282.2" y="142.2" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#27292D" text-anchor="middle" letter-spacing="0.6">CODE</text><text x="264" y="166" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="650" fill="#27292D" text-anchor="start">Traceability</text><text x="264" y="188" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">Matches each</text><text x="264" y="204" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">requirement to the</text><text x="264" y="220" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">tasks that claim it</text><path d="M414,184.0 L440,184.0" fill="none" stroke="#9AA3AF" stroke-width="2" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="444" y="118" width="178" height="132" rx="10" fill="#315F9E" /><rect x="458" y="130" width="43" height="17" rx="8.5" fill="#FFFFFF" fill-opacity="0.92"/><text x="479.5" y="142.2" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#315F9E" text-anchor="middle" letter-spacing="0.6">MODEL</text><text x="458" y="166" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="650" fill="#FFFFFF" text-anchor="start">Plan Verifier</text><text x="458" y="188" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#DCE6F4" text-anchor="start">Blind check: never sees</text><text x="458" y="204" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#DCE6F4" text-anchor="start">the Architect's</text><text x="458" y="220" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#DCE6F4" text-anchor="start">reasoning. Read-only</text><path d="M626,184.0 L652,184.0" fill="none" stroke="#9AA3AF" stroke-width="2" marker-end="url(#ah)" stroke-linejoin="round"/><path d="M708,132.0 L760,184.0 L708,236.0 L656,184.0 z" fill="#FFFFFF" stroke="#27292D" stroke-width="1.5"/><text x="708" y="180.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="650" fill="#27292D" text-anchor="middle">Critical</text><text x="708" y="196.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="650" fill="#27292D" text-anchor="middle">issues?</text><path d="M762,184.0 L780,184.0" fill="none" stroke="#9AA3AF" stroke-width="2" marker-end="url(#ah)" stroke-linejoin="round"/><text x="767" y="176.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#5E646E" text-anchor="middle">no</text><rect x="784" y="118" width="144" height="132" rx="10" fill="#EAF0F8" stroke="#315F9E" stroke-width="1.5" /><rect x="798" y="130" width="50" height="17" rx="8.5" fill="#FFFFFF" fill-opacity="1"/><text x="822.8" y="142.2" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#315F9E" text-anchor="middle" letter-spacing="0.6">OUTPUT</text><text x="798" y="168" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#315F9E" text-anchor="start">PASSED</text><text x="798" y="188" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#27292D" text-anchor="start">coverage per</text><text x="798" y="204" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#27292D" text-anchor="start">requirement: full,</text><text x="798" y="220" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#27292D" text-anchor="start">partial or missing</text><path d="M708,238.0 L708,318" fill="none" stroke="#9AA3AF" stroke-width="2" marker-end="url(#ah)" stroke-linejoin="round"/><text x="718" y="262.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#5E646E" text-anchor="start">yes</text><rect x="620" y="322" width="200" height="116" rx="10" fill="#315F9E" /><rect x="634" y="334" width="43" height="17" rx="8.5" fill="#FFFFFF" fill-opacity="0.92"/><text x="655.5" y="346.2" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#315F9E" text-anchor="middle" letter-spacing="0.6">MODEL</text><text x="634" y="370" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="650" fill="#FFFFFF" text-anchor="start">Fix Agent</text><text x="634" y="392" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#DCE6F4" text-anchor="start">Edits only the listed task</text><text x="634" y="408" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#DCE6F4" text-anchor="start">records. Invalid edits are</text><text x="634" y="424" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#DCE6F4" text-anchor="start">undone</text><path d="M616,372 L533,372 L533,254" fill="none" stroke="#9AA3AF" stroke-width="2" marker-end="url(#ah)" stroke-linejoin="round"/><text x="606" y="394" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#5E646E" text-anchor="end">re-verify, up to 3 cycles</text><text x="606" y="411" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#92400E" text-anchor="end">still failing → FAILED, exit 1</text><rect x="32" y="458" width="896" height="50" rx="10" fill="#27292D" /><rect x="48" y="474.0" width="58" height="18" rx="9" fill="#FEF3C7"/><text x="77" y="487.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#92400E" text-anchor="middle" letter-spacing="0.8">LIMIT</text><text x="120" y="479.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#FFFFFF" text-anchor="start">PASS means no critical failures, not complete coverage. If the Fix Agent changed tasks, read the diff before</text><text x="120" y="496.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#FFFFFF" text-anchor="start">you trust the plan.</text><rect x="32" y="530" width="14" height="14" rx="3" fill="#315F9E" /><text x="53" y="541.5" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">Model judgment</text><rect x="154.39999999999998" y="530" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#27292D" stroke-width="1.3" /><text x="175.39999999999998" y="541.5" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">Deterministic code</text><rect x="303.2" y="530" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#D9DCE1" stroke-width="1" /><rect x="303.2" y="530" width="4" height="14" rx="2" fill="#D97706"/><text x="324.2" y="541.5" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">Gate: can stop the run</text><rect x="478.4" y="530" width="14" height="14" rx="3" fill="#F6F6F7" stroke="#D9DCE1" stroke-width="1.3" /><text x="499.4" y="541.5" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">Input</text><rect x="541.4" y="530" width="14" height="14" rx="3" fill="#EAF0F8" stroke="#315F9E" stroke-width="1.3" /><text x="562.4" y="541.5" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">Output</text></svg>