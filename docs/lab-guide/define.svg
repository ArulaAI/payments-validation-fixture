<svg xmlns="http://www.w3.org/2000/svg" width="960" height="468" viewBox="0 0 960 468" role="img" aria-label="How Define and Draft works"><title>How Define and Draft works</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA3AF"/></marker></defs><rect x="0.75" y="0.75" width="958.5" height="466.5" rx="16" fill="#FFFFFF" stroke="#E3E6EB" stroke-width="1.5"/><text x="32" y="40" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" font-weight="600" fill="#315F9E" text-anchor="start">Claude Code: /author-tech-spec adaptive-auth</text><text x="32" y="67" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#27292D" text-anchor="start">Define and Draft · the assistant asks, you decide</text><text x="32" y="90" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5E646E" text-anchor="start">About half an hour. The assistant brings evidence and options; you decide, or name the owner who should.</text><rect x="32" y="122" width="170" height="120" rx="10" fill="#315F9E" /><rect x="46" y="134" width="43" height="17" rx="8.5" fill="#FFFFFF" fill-opacity="0.92"/><text x="67.5" y="146.2" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#315F9E" text-anchor="middle" letter-spacing="0.6">MODEL</text><text x="46" y="170" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="650" fill="#FFFFFF" text-anchor="start">Reads everything</text><text x="46" y="192" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#DCE6F4" text-anchor="start">Seven documents, the</text><text x="46" y="208" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#DCE6F4" text-anchor="start">code, both drafts and</text><text x="46" y="224" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#DCE6F4" text-anchor="start">the RFC template</text><path d="M206,182 L228,182" fill="none" stroke="#9AA3AF" stroke-width="2" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="232" y="122" width="178" height="120" rx="10" fill="#FFFFFF" stroke="#27292D" stroke-width="2.2" /><rect x="246" y="134" width="34" height="17" rx="8.5" fill="#27292D"/><text x="263.0" y="146.2" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.6">YOU</text><text x="246" y="172" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#27292D" text-anchor="start">Check the summary</text><text x="246" y="192" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">Ask what it inferred,</text><text x="246" y="208" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">not read. Correct it,</text><text x="246" y="224" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">then confirm the scope</text><path d="M414,182 L444,182" fill="none" stroke="#9AA3AF" stroke-width="2" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="448" y="108" width="480" height="238" rx="14" fill="#F8F9FB" stroke="#E6E9EE" stroke-width="1.2" /><text x="464" y="126" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="800" fill="#27292D" text-anchor="start" letter-spacing="0.8">ONE TOPIC AT A TIME · 8 TOPICS</text><rect x="464" y="138" width="136" height="124" rx="10" fill="#315F9E" /><rect x="478" y="150" width="43" height="17" rx="8.5" fill="#FFFFFF" fill-opacity="0.92"/><text x="499.5" y="162.2" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#315F9E" text-anchor="middle" letter-spacing="0.6">MODEL</text><text x="478" y="186" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="650" fill="#FFFFFF" text-anchor="start">Topic n</text><text x="478" y="208" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#DCE6F4" text-anchor="start">Evidence,</text><text x="478" y="224" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#DCE6F4" text-anchor="start">options and a</text><text x="478" y="240" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#DCE6F4" text-anchor="start">recommendation</text><path d="M604,200 L622,200" fill="none" stroke="#9AA3AF" stroke-width="2" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="626" y="138" width="140" height="124" rx="10" fill="#FFFFFF" stroke="#27292D" stroke-width="2.2" /><rect x="640" y="150" width="34" height="17" rx="8.5" fill="#27292D"/><text x="657.0" y="162.2" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.6">YOU</text><text x="640" y="188" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#27292D" text-anchor="start">Decide or route</text><text x="640" y="208" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">Ours: decide. Not</text><text x="640" y="224" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">ours: owner and</text><text x="640" y="240" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">default</text><path d="M770,200 L784,200" fill="none" stroke="#9AA3AF" stroke-width="2" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="788" y="138" width="128" height="124" rx="10" fill="#FFFFFF" stroke="#27292D" stroke-width="2.2" /><rect x="802" y="150" width="34" height="17" rx="8.5" fill="#27292D"/><text x="819.0" y="162.2" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.6">YOU</text><text x="802" y="188" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#27292D" text-anchor="start">Review diff</text><text x="802" y="208" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">git diff on</text><text x="802" y="224" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">both specs</text><path d="M852,266 L852,302 L532,302 L532,266" fill="none" stroke="#9AA3AF" stroke-width="2" marker-end="url(#ah)"/><text x="692" y="322" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#5E646E" text-anchor="middle">next topic: every answer is saved as you go</text><rect x="32" y="272" width="378" height="74" rx="10" fill="#EAF0F8" stroke="#315F9E" stroke-width="1.5" /><rect x="46" y="283" width="56" height="17" rx="8.5" fill="#FFFFFF" fill-opacity="1"/><text x="74.1" y="295.2" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#315F9E" text-anchor="middle" letter-spacing="0.6">RECORDS</text><text x="46" y="321" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" font-weight="650" fill="#315F9E" text-anchor="start">.speed/authoring/adaptive-auth/</text><text x="46" y="337" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#27292D" text-anchor="start">session · questions · decisions · coverage</text><path d="M688,348 L688,370" fill="none" stroke="#9AA3AF" stroke-width="2" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="560" y="374" width="256" height="44" rx="10" fill="#FFFFFF" stroke="#27292D" stroke-width="2.2"/><text x="688" y="401" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#27292D" text-anchor="middle">Ready for review? Ready to plan?</text><text x="32" y="401" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="650" fill="#27292D" text-anchor="start">Pause any time:</text><text x="132" y="401" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" font-weight="600" fill="#315F9E" text-anchor="start">/author-tech-spec adaptive-auth resume</text><rect x="32" y="440" width="14" height="14" rx="3" fill="#315F9E" /><text x="53" y="451.5" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5E646E" text-anchor="start">Assistant (model)</text>